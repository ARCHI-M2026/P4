<div class="layout" test-id="admin-layout">

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="title">DataShare</div>

        <nav class="menu">
            <div class="menu-item active">Mes fichiers</div>
        </nav>

        <div class="footer">Copyright DataShare® 2025</div>
    </aside>

    <!-- Sidebar Mobile -->
    <aside class="sidebar-mobile" [class.sidebar-visible]="isSidebarVisible()">
        <div class="sidebar-mobile-header">
            <button class="sidebar-mobile-header-icon" (click)="toggleSidebar()">
                <img src="/images/close.svg" alt="fermer le menu" />
            </button>
            <div class="title">DataShare</div>
        </div>
        <nav class="menu">
            <button class="mobile-menu-item" (click)="toggleSidebar()">Mes fichiers</button>
            <div class="mobile-menu-item" routerLink="/files/upload">Ajouter des fichiers</div>
        </nav>
    </aside>

    <div class="main">

        <header class="header">

            <button class="btnMenu btnAddFiles" routerLink="/files/upload" test-id="go-to-upload">Ajouter des fichiers</button>
            <div class="button-link button-logout">
                <button (click)="logout()" test-id="admin-logout">Déconnexion</button>
            </div>
        </header>

        <!-- Header mobile -->
        <header class="header-mobile">

            <div class="menu-hamburger-mobile-container">
                <button class="menu-hamburger-mobile-btn" (click)="toggleSidebar()" aria-label="Ouvrir le menu"
                    alt="Ouvrir le menu">
                </button>
            </div>

            <div class="button-link button-logout">
                <button (click)="logout()">Déconnexion</button>
            </div>
        </header>

        <div class="content">
            <router-outlet/>            
        </div>
    </div>
</div>
