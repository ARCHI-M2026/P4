version: 2

updates:
  - package-ecosystem: npm
    directories:
      - /
      - /frontend
      - /backend
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Paris
    cooldown:
      default-days: 5
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    groups:
      angular:
        patterns:
          - '@angular/*'
          - '@angular-devkit/*'
          - 'angular-eslint'
      nestjs:
        patterns:
          - '@nestjs/*'
      prisma:
        patterns:
          - 'prisma'
          - '@prisma/*'
      aws-sdk:
        patterns:
          - '@aws-sdk/*'
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Paris
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - '*'