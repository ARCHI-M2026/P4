commit-msg:
  commands:
    conventional-commit:
      run: npx --no-install commitlint --edit {1}

pre-commit:
  parallel: true
  commands:
    lint-backend:
      root: "backend/"
      glob: "*.{ts,js}"
      run: npx --no-install eslint {staged_files}

    # Nécessite : cd frontend && ng add @angular-eslint/schematics
    lint-frontend:
      root: "frontend/"
      glob: "*.{ts,html}"
      run: npx --no-install eslint {staged_files}
