site_name: DataShare
site_description: Documentation technique de DataShare, application de transfert de fichiers avec liens temporaires.
docs_dir: docs
site_dir: site

theme:
  name: material
  language: fr
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Passer en mode sombre
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Passer en mode clair
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - toc.follow
    - search.highlight
    - content.code.copy
    - content.tabs.link

plugins:
  - search:
      lang: fr

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Accueil:
      - Présentation: index.md
      - Stack et versions: versions.md
  - Backend:
      - Architecture: backend/index.md
      - API (OpenAPI): backend/api.md
  - Frontend:
      - Architecture: frontend/index.md
  - Qualité:
      - Tests: tests.md
      - Performance: performance.md
  - Exploitation:
      - Maintenance: maintenance.md
      - Sécurité: securite.md
